name: Sync release docs

# 发版后自动：更新日志页 + version.json，并推送
# 部署联动由 deploy.yml 的 workflow_run 触发（GITHUB_TOKEN 的 push 本身不触发工作流）
on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-release-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Generate changelog + version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIN_TAG: v2.0.0
        run: node .github/generate-changelog.mjs

      - name: Commit if changed
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add page/docs/guide/changelog.md update/version.json page/docs/public/latest-release.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "docs: sync changelog, version.json and latest-release from releases"
          # 发布后紧接着有人推代码时，检出点会落后于远端，push 会被拒；拉最新提交变基后重试
          for i in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push 被拒，第 $i 次重试"
            if ! git pull --rebase origin "$BRANCH"; then
              git rebase --abort || true
              echo "变基失败，需要人工处理" >&2
              exit 1
            fi
          done
          echo "重试 3 次仍被拒，需要人工处理" >&2
          exit 1
