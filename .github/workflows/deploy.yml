name: page

on:
  push:
    branches: [main]
    paths:
      - 'page/**'
      - '.github/workflows/deploy.yml'
  # GITHUB_TOKEN 的 push 不会触发本工作流，发版后由 sync-release-docs 完成时联动
  workflow_run:
    workflows: ['Sync release docs']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !github.event.workflow_run || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: page/package-lock.json

      - name: Install dependencies
        working-directory: page
        run: npm ci

      - name: Refresh changelog from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MIN_TAG: v2.0.0
        run: node .github/generate-changelog.mjs
        continue-on-error: true

      - name: Build
        working-directory: page
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: page/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
