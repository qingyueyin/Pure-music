name: Update star history

on:
  schedule:
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/generate-star-history.mjs

      - name: Commit changed chart
        run: |
          if git diff --quiet -- assets/star-history.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          git commit -m "docs: update star history"
          git push
