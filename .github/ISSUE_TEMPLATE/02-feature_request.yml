name: 新功能请求
description: 提议一个有明确使用场景的新功能
title: "[新功能] "
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        项目会优先考虑具有普遍使用价值、符合整体方向的功能请求。只适用于个人审美、特殊操作习惯或单一环境的需求，一般不纳入主项目，更适合通过 Fork 按需维护。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明谁会在什么情况下使用这个功能，以及当前流程遇到了什么具体问题。
      placeholder: 描述一次具体的使用过程和当前障碍。
    validations:
      required: true

  - type: textarea
    id: general_value
    attributes:
      label: 普适性说明
      description: 说明除你之外还有哪些用户会遇到相同问题、适用范围有多大，以及为什么适合加入项目主线。
      placeholder: 描述共同需求、适用人群和对现有用户的影响。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 功能方案
      description: 说明功能入口、操作过程和预期结果，不要只填写功能名称。
      placeholder: 用户从哪里进入、如何操作、最终得到什么结果。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出实现后可以直接验证的结果。
      placeholder: |
        1. 当……时，程序应……
        2. 关闭或切换……后，程序应……
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 影响与兼容性
      description: 说明是否改变默认行为、现有设置或数据格式，以及对性能、界面复杂度和既有用户操作习惯的影响。
      placeholder: 描述如何兼容现有行为，以及是否需要迁移或额外配置。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式
      description: 说明目前如何完成这件事，以及现有方式为什么不足；没有替代方式时写明原因。
      placeholder: 当前做法及其限制。
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 补充材料
      description: 添加草图、录屏、示例文件或其他有助于理解需求的材料。
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有的开放和已关闭 Issue，确认没有相同请求。
          required: true
        - label: 我已在正文中提供具体场景、功能方案和验收标准。
          required: true
        - label: 我已说明该功能的普遍使用价值，以及它对现有用户的影响。
          required: true
        - label: 我已考虑默认行为、兼容性和后续维护成本。
          required: true
        - label: 我愿意继续关注此 Issue，并补充实现范围和行为细节。
          required: true
